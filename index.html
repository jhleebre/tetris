<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>별조각 쌓기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div class="progress"><i id="prog"></i></div>
  <div class="hud" id="hud">
    <div class="row">
      <div class="chip mode" id="modeChip">마라톤</div>
      <div class="chip"><small>점수</small><span id="scoreTxt">0</span></div>
      <div class="chip"><small id="linesLabel">줄</small><span id="linesTxt">0</span></div>
      <div class="chip"><small>레벨</small><span id="levelTxt">1</span></div>
      <div class="chip"><small id="timeLabel">시간</small><span id="timeTxt">0:00.00</span></div>
    </div>
    <div class="row">
      <button class="iconBtn" id="musicBtn" title="음악 (N)">음악 켬</button>
      <button class="iconBtn" id="muteBtn" title="소리 (M)">소리 켬</button>
      <button class="iconBtn" id="menuBtn" title="메뉴 (Esc)">메뉴</button>
    </div>
  </div>
  <div class="banner" id="banner"><b id="bannerTitle"></b><span id="bannerSub"></span></div>

  <div class="overlay show" id="menu">
    <div class="card">
      <h1>별조각 쌓기</h1>
      <p>떨어지는 별조각을 맞춰 가로줄을 채우면 그 줄이 사라집니다.<br>블록이 꼭대기까지 쌓이기 전에 줄을 지우세요.</p>
      <div class="modes" id="modes"></div>
      <div class="keys">
        <span><kbd>←</kbd><kbd>→</kbd></span><span>좌우로 움직이기</span>
        <span><kbd>↓</kbd></span><span>천천히 내리기</span>
        <span><kbd>↑</kbd><kbd>X</kbd> / <kbd>Z</kbd></span><span>시계 방향 / 반시계 방향 회전</span>
        <span><kbd>스페이스</kbd></span><span>바로 내리기 (메뉴에서는 선택한 모드 시작)</span>
        <span><kbd>C</kbd><kbd>Shift</kbd></span><span>보관 (한 블록에 한 번)</span>
        <span><kbd>R</kbd> <kbd>Esc</kbd></span><span>다시 시작 · 메뉴</span>
        <span><kbd>N</kbd> <kbd>M</kbd></span><span>음악 켜기/끄기 · 모든 소리 켜기/끄기</span>
      </div>
    </div>
  </div>

  <div class="overlay" id="result">
    <div class="card">
      <h2 id="resTitle"></h2>
      <p id="resSub"></p>
      <div class="stat" id="resStat"></div>
      <div class="btns">
        <button class="btn" id="resMain"></button>
        <button class="btn alt" id="resAlt"></button>
        <button class="btn alt" id="resMenu">메뉴</button>
      </div>
      <p class="hint">스페이스: <span id="resHint"></span></p>
    </div>
  </div>

  <div class="pad" id="pad">
    <div class="grp move">
      <button class="tb" data-k="left" aria-label="왼쪽">◀</button>
      <button class="tb" data-k="right" aria-label="오른쪽">▶</button>
      <button class="tb wide" data-k="down" aria-label="천천히 내리기">▼</button>
    </div>
    <div class="grp act">
      <button class="tb small" data-k="hold">보관</button>
      <button class="tb" data-k="rotCCW" aria-label="반시계 회전">↺</button>
      <button class="tb" data-k="rotCW" aria-label="시계 회전">↻</button>
      <button class="tb drop" data-k="drop">낙하</button>
    </div>
  </div>
</div>

<script type="module" src="src/main.js"></script>
</body>
</html>
